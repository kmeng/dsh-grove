<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Grove panel between DeepSeek Harness and an Obsidian vault">
  <rect width="640" height="300" rx="20" fill="#F7F4EC"/>
  <rect x="20" y="20" width="600" height="260" rx="16" fill="#FBF9F3" stroke="#E4DCCC" stroke-width="1.5"/>

  <!-- DeepSeek Harness window -->
  <g>
    <rect x="44" y="70" width="164" height="160" rx="12" fill="#FFFFFF" stroke="#C3D3C9" stroke-width="2"/>
    <path d="M44 82a12 12 0 0 1 12-12h140a12 12 0 0 1 12 12v8H44z" fill="#E8EFEA"/>
    <circle cx="60" cy="80" r="3" fill="#5FA37E"/>
    <circle cx="72" cy="80" r="3" fill="#C98A3B"/>
    <circle cx="84" cy="80" r="3" fill="#C3D3C9"/>
    <rect x="60" y="112" width="98" height="16" rx="8" fill="#E8EFEA"/>
    <rect x="60" y="144" width="126" height="16" rx="8" fill="#DCEAE1"/>
    <rect x="60" y="180" width="72" height="14" rx="7" fill="#2F7D5B" opacity="0.85"/>
  </g>

  <!-- arrows -->
  <g stroke="#C98A3B" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7" fill="none">
    <path d="M218 150h54"/>
    <path d="M368 150h54"/>
  </g>
  <path d="M276 143l10 7-10 7z" fill="#C98A3B"/>
  <path d="M426 143l10 7-10 7z" fill="#C98A3B"/>

  <!-- Grove mark -->
  <g transform="translate(282 100) scale(1.9)">
    <path d="M16.9 30.4h2.2l-.65-12.3h-.9z" fill="#1B3A2E"/>
    <path d="M18.4 19c2.2-6.5 8.3-9.4 10.5-8.15-1 5.3-4.9 8.45-10.5 8.15Z" fill="#2F7D5B"/>
    <path d="M17.6 23c-2.2-5.1-6.5-7.3-8.5-6.3.7 4.1 4.3 6.3 8.5 6.3Z" fill="#5FA37E"/>
    <path d="M15.4 31.5h5.2" stroke="#C98A3B" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Obsidian vault window -->
  <g>
    <rect x="432" y="70" width="164" height="160" rx="12" fill="#FFFFFF" stroke="#C3D3C9" stroke-width="2"/>
    <path d="M432 82a12 12 0 0 1 12-12h60a12 12 0 0 1 12 12v6h-84z" fill="#E8EFEA"/>
    <rect x="448" y="104" width="52" height="34" rx="5" fill="#E8EFEA"/>
    <rect x="508" y="104" width="52" height="34" rx="5" fill="#DCEAE1"/>
    <rect x="448" y="146" width="52" height="34" rx="5" fill="#DCEAE1"/>
    <rect x="508" y="146" width="52" height="34" rx="5" fill="#E8EFEA"/>
    <rect x="448" y="188" width="112" height="24" rx="5" fill="#F1EEE4" stroke="#E4DCCC"/>
  </g>

  <!-- amber baseline -->
  <path d="M300 214h40" stroke="#C98A3B" stroke-width="4" stroke-linecap="round"/>
</svg>
