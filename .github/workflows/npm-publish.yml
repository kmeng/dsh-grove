# Test the release and publish to npmjs.org and GitHub Packages.

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}

  publish-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://npm.pkg.github.com
          scope: '@kmeng'
      - run: npm ci
      - name: Prepare scoped package
        run: |
          stage=$(mktemp -d "${RUNNER_TEMP}/grove-package.XXXXXX")
          npm pack --pack-destination "$stage"
          tar -xzf "$stage"/dsh-grove-*.tgz -C "$stage"
          node scripts/prepare-github-package.mjs "$stage/package"
          echo "GROVE_GITHUB_PACKAGE=$stage/package" >> "$GITHUB_ENV"
      - run: npm publish "$GROVE_GITHUB_PACKAGE" --tag latest --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
